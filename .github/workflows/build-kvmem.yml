name: build-kvmem-prism3
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install VS2022 BuildTools
        shell: pwsh
        run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022

      - name: Install CUDA 13 (redist merge)
        shell: pwsh
        run: |
          $root = "C:\cuda"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $comps = [ordered]@{
            'cuda_nvcc'       = 'cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.0.48-archive.zip'
            'libnvvm'         = 'libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.0.48-archive.zip'
            'cuda_crt'        = 'cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.0.48-archive.zip'
            'cuda_cudart'     = 'cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.0.48-archive.zip'
            'libcublas'       = 'libcublas/windows-x86_64/libcublas-windows-x86_64-13.0.0.19-archive.zip'
            'cuda_cccl'       = 'cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-13.0.50-archive.zip'
            'cuda_cuobjdump'  = 'cuda_cuobjdump/windows-x86_64/cuda_cuobjdump-windows-x86_64-13.0.39-archive.zip'
            'cuda_nvdisasm'   = 'cuda_nvdisasm/windows-x86_64/cuda_nvdisasm-windows-x86_64-13.0.39-archive.zip'
            'cuda_cuxxfilt'   = 'cuda_cuxxfilt/windows-x86_64/cuda_cuxxfilt-windows-x86_64-13.0.39-archive.zip'
          }
          foreach($k in $comps.Keys){
            $u = "https://developer.download.nvidia.com/compute/cuda/redist/$($comps[$k])"
            $z = "$env:TEMP\$k.zip"
            curl.exe -sL $u -o $z
            $d = "$env:TEMP\$k"
            Expand-Archive $z -DestinationPath $d -Force
            $inner = Get-ChildItem $d -Directory | Select-Object -First 1
            Copy-Item "$($inner.FullName)\*" $root -Recurse -Force
            Remove-Item $z -Force
            Remove-Item $d -Recurse -Force
          }
          & "$root\bin\nvcc.exe" --version

      - name: Fetch official source + apply instrumentation
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.16.0-rc3-prism.3 --recurse-submodules --shallow-submodules https://github.com/kvmem/kvmem-llama.cpp srcout/source
          $src = 'srcout/source'
          Copy-Item tools/llama-kvmem-server.cpp "$src/tools/llama-kvmem-server.cpp" -Force
          "SRC=$src" | Out-File $env:GITHUB_ENV -Append

      - name: Apply kvmem cumulative patch
        shell: bash
        run: cd srcout/source && sed -i 's/\r$//' patches/*.patch scripts/*.sh 2>/dev/null; bash scripts/apply-patches.sh && ls llama.cpp/src/llama-kvmem-factory.h

      - name: Configure
        shell: pwsh
        run: cmake -S $env:SRC -B build -G Ninja -DCMAKE_CUDA_ARCHITECTURES=89-real -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DKVMEM_ENABLE_NVME=OFF -DCMAKE_BUILD_TYPE=Release -DCUDAToolkit_ROOT=C:\cuda -DLLAMA_CURL=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build -j 4

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          xcopy /E /Y build\bin\* out\
      - uses: actions/upload-artifact@v4
        with:
          name: kvmem-prism3-sm89
          path: out


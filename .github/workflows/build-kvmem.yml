name: build-kvmem-prism3
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install VS2022 BuildTools
        shell: pwsh
        run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022

      - name: Install CUDA 13 (redist merge)
        shell: pwsh
        run: |
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $comps = @('cuda_nvcc','libnvvm','cuda_crt','cuda_cudart','libcublas','cuda_cccl','cuda_cuobjdump','cuda_nvdisasm','cuda_cuxxfilt')
          New-Item -ItemType Directory -Force -Path C:\cuda | Out-Null
          foreach($c in $comps){
            $man = Invoke-RestMethod "$base/redistrib_13.0.48.json"
            $rel = $man.$c.windows-x86_64.relative_path
            Invoke-WebRequest "$base/$rel" -OutFile "C:\dl_$c.zip"
            Expand-Archive "C:\dl_$c.zip" -DestinationPath C:\cudatmp -Force
            Get-ChildItem C:\cudatmp | ForEach-Object { Copy-Item $_.FullName\* C:\cuda -Recurse -Force }
          }

      - name: Fetch official source + apply instrumentation
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/kvmem/kvmem-llama.cpp/releases/download/v0.16.0-rc3-prism.3/kvmem-v0.16.0-rc3-prism.3-source.zip' -OutFile src.zip
          Expand-Archive src.zip -DestinationPath srcout -Force
          $src = (Get-ChildItem srcout | Select-Object -First 1).FullName
          Copy-Item tools/llama-kvmem-server.cpp "$src/tools/llama-kvmem-server.cpp" -Force
          Copy-Item . "$src\.github-tmp" -Recurse -Force -ErrorAction SilentlyContinue
          "SRC=$src" | Out-File $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: cmake -S $env:SRC -B build -G Ninja -DCMAKE_CUDA_ARCHITECTURES=89-real -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DKVMEM_ENABLE_NVME=OFF -DCMAKE_BUILD_TYPE=Release -DCUDAToolkit_ROOT=C:\cuda -DLLAMA_CURL=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build -j 4

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          xcopy /E /Y build\bin\* out\
      - uses: actions/upload-artifact@v4
        with:
          name: kvmem-prism3-sm89
          path: out

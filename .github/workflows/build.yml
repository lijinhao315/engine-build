name: Build bonsai2 CUDA engine
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout sudoingx bonsai2 branch
        run: |
          git clone --depth 1 --branch bonsai2 https://github.com/sudoingX/llama.cpp.git src

      - name: Install CUDA 12.4 (direct NVIDIA installer)
        shell: cmd
        run: |
          curl.exe -L -o C:\cuda_installer.exe https://developer.download.nvidia.com/compute/cuda/12.4.0/local_installers/cuda_12.4.0_551.61_windows.exe
          C:\cuda_installer.exe -s
          if not exist "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\nvcc.exe" (echo NVCC_MISSING & exit /b 1)
          del C:\cuda_installer.exe
          "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\nvcc.exe" --version

      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in ("C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath"`) do set "VSDIR=%%i"
          echo VSDIR=%VSDIR%
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin;%PATH%
          cmake -S src -B build -G Ninja -DCMAKE_CUDA_ARCHITECTURES=89 -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DLLAMA_CURL=OFF

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in ("C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath"`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin;%PATH%
          cmake --build build -j 4

      - name: Collect binaries
        shell: cmd
        run: |
          mkdir out
          copy build\bin\Release\*.exe out\
          copy build\bin\Release\*.dll out\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cudart64_12.dll" out\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-cuda-engine
          path: out